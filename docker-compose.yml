services:
  postgres:
    image: postgres:16-alpine
    container_name: basf_demo_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: basf
      POSTGRES_PASSWORD: basf
      POSTGRES_DB: basf_demo
    ports:
      - "55432:5432"
    volumes:
      - basf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basf -d basf_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  basf_pg_data:
